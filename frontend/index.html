<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>LeadSnap</title>
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LeadSnap">
<link rel="manifest" href="manifest.json?v=5">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=5">
<link rel="apple-touch-icon" href="icons/icon-192.png?v=5">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="icons/favicon.svg?v=5" alt="" class="brand-logo">
    <span>LeadSnap</span>
  </div>
  <button id="eventSwitcher" class="event-switcher" title="Messe wechseln">
    <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>
    <span id="currentEventName">Messe wählen</span>
    <svg viewBox="0 0 24 24" class="icon icon-sm" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</header>

<div id="syncBar" class="sync-bar">
  <span id="syncDot" class="sync-dot"></span>
  <span id="syncText">Online</span>
</div>

<main id="mainView">

  <section id="listView">
    <div class="toolbar">
      <div class="count" id="contactCount">0 Kontakte</div>
      <input type="search" id="searchBox" placeholder="Suchen (Name, Firma, Thema)…">
    </div>
    <div id="noEventBanner" class="no-event-banner hidden">
      <p>Noch keine Messe ausgewählt.</p>
      <button type="button" class="btn primary" id="noEventCreateBtn">Erste Messe anlegen</button>
    </div>
    <div id="emptyState" class="empty-state hidden">
      <p>Noch keine Kontakte erfasst.</p>
      <p>Tippe unten rechts auf <strong>+</strong>, um deinen ersten Kontakt aufzunehmen.</p>
    </div>
    <ul id="contactList" class="contact-list"></ul>
  </section>

  <section id="formView" class="hidden">
    <form id="contactForm">
      <div class="photo-section">
        <label class="photo-capture" id="photoLabel">
          <img id="photoPreview" class="hidden">
          <span id="photoPlaceholder">
            <svg viewBox="0 0 24 24" class="icon icon-lg" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="14" r="3.5"/></svg>
            <br>Visitenkarte fotografieren
          </span>
          <input type="file" accept="image/*" capture="environment" id="photoInput">
        </label>
        <button type="button" id="retakeBtn" class="link-btn hidden">Neues Foto</button>
        <div id="extractStatus" class="extract-status hidden"></div>
        <div id="locationStatus" class="extract-status hidden"></div>
      </div>

      <div class="field-grid">
        <div class="field">
          <label>Name *</label>
          <input type="text" id="f_name" autocomplete="off" required>
        </div>
        <div class="field">
          <label>Firma</label>
          <input type="text" id="f_company" autocomplete="off">
        </div>
        <div class="field">
          <label>Position</label>
          <input type="text" id="f_position" autocomplete="off">
        </div>
        <div class="field">
          <label>Telefon</label>
          <input type="tel" id="f_phone" autocomplete="off">
        </div>
        <div class="field">
          <label>E-Mail</label>
          <input type="email" id="f_email" autocomplete="off">
        </div>
        <div class="field full">
          <label>Adresse</label>
          <input type="text" id="f_address" autocomplete="off" placeholder="Straße, PLZ, Ort">
        </div>
        <div class="field">
          <label>Thema / Interesse</label>
          <input type="text" id="f_topic" autocomplete="off" placeholder="z.B. Produkt X, Kooperation">
        </div>
        <div class="field full">
          <label>Notizen</label>
          <textarea id="f_notes" rows="3" placeholder="Kurze Notizen zum Gespräch…"></textarea>
        </div>
        <div class="field">
          <label>Priorität</label>
          <select id="f_priority">
            <option value="normal">Normal</option>
            <option value="hoch">★ Hoch – dringend nachfassen</option>
            <option value="niedrig">Niedrig</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" id="cancelBtn" class="btn secondary">Abbrechen</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    </form>
  </section>

  <section id="detailView" class="hidden">
    <div id="detailContent"></div>
    <div class="form-actions">
      <button type="button" id="detailEditBtn" class="btn secondary">Bearbeiten</button>
      <button type="button" id="detailDeleteBtn" class="btn danger">Löschen</button>
    </div>
  </section>

  <section id="exportView" class="hidden">
    <h2>Export</h2>
    <p class="hint" id="exportSyncHint"></p>
    <button class="btn secondary wide" id="syncNowBtn">Jetzt synchronisieren</button>
    <hr>
    <p class="hint">Exportiere die Kontakte von <strong id="exportEventName">–</strong>.</p>
    <button class="btn primary wide" id="exportCsvBtn">CSV exportieren (Excel)</button>
    <button class="btn primary wide" id="exportVcfBtn">vCard exportieren (Kontakte-App)</button>
    <button class="btn secondary wide" id="exportJsonBtn">JSON-Backup exportieren</button>
    <hr>
    <button class="btn danger wide" id="clearAllBtn">Kontakte dieser Messe löschen</button>
  </section>

  <section id="eventView" class="hidden">
    <div class="event-view-header">
      <h2>Messen</h2>
      <button type="button" id="eventCloseBtn" class="icon-btn" title="Schließen">
        <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <ul id="eventList" class="event-list"></ul>

    <button type="button" class="btn primary wide" id="addEventBtn">+ Neue Messe anlegen</button>

    <form id="eventForm" class="hidden">
      <div class="field">
        <label>Name der Messe *</label>
        <input type="text" id="ev_name" required placeholder="z.B. Hannover Messe 2026">
      </div>
      <div class="field">
        <label>Ort</label>
        <input type="text" id="ev_location" placeholder="z.B. Hannover">
      </div>
      <div class="field-grid">
        <div class="field">
          <label>Start</label>
          <input type="date" id="ev_start">
        </div>
        <div class="field">
          <label>Ende</label>
          <input type="date" id="ev_end">
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn secondary" id="eventFormCancelBtn">Abbrechen</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    </form>
  </section>

</main>

<button id="fabAdd" class="fab" title="Neuer Kontakt">
  <svg viewBox="0 0 24 24" class="icon icon-lg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="bottomnav">
  <button class="navbtn active" data-view="listView">
    <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M8 9h8M8 12.5h8M8 16h5"/></svg>
    <span>Liste</span>
  </button>
  <button class="navbtn" data-view="exportView">
    <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
    <span>Export</span>
  </button>
</nav>

<div id="footer" class="deploy-footer"></div>

<script src="db.js?v=5"></script>
<script src="app.js?v=5"></script>
<script>
fetch("/_manager/cgi-bin/app_status.py?name=leadsnap")
  .then(r => r.json())
  .then(s => {
    if (s.commit_date) {
      const d = new Date(s.commit_date).toLocaleString();
      document.getElementById("footer").textContent = `${d} – "${s.commit_message}"`;
    }
  })
  .catch(() => {});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js?v=5").catch((err) => {
      console.warn("Service worker registration failed:", err);
    });
  });
}
</script>
</body>
</html>
